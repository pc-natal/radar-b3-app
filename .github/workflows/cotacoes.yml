name: Cotações (a cada 15 min no pregão)
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'   # 10h00–18h45 de Brasília (de novembro a março, fora do horário de verão americano, a B3 fecha às 18h)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: dados, cancel-in-progress: false }
jobs:
  cotacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yfinance==1.7.0
      - run: python cotacoes.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "radar-b3-bot"; git config user.email "radar-b3-bot@users.noreply.github.com"
          git add data/cotacoes.json; git add data/alertas.json 2>/dev/null || true
          git commit -m "cotações $(date -u +%FT%H:%M)" || exit 0
          git pull --rebase -q && git push -q
